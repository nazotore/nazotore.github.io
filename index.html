const STXT = { off: "ログインしていません", sync: "同期中…", ok: "同期済み", err: "同期できませんでした", offline: "オフライン（つながったら送ります）" };

    box.innerHTML = `<h3>${up ? "アカウントを作る" : "ログイン"}</h3><p>ぺたろぐと同じアカウントで使えます。ログインすると、PCとスマホで同じデータになります。</p>
      
      <input type="email" autocomplete="email" placeholder="メールアドレス" data-em><input type="password" autocomplete="${up ? "new-password" : "current-password"}" placeholder="パスワード${up ? "（6文字以上）" : ""}" data-pw>
      <div class="msg" data-msg></div>
      <button class="b p" data-go>${up ? "アカウントを作る" : "メールでログイン"}</button>
      <div class="row"><button class="l" data-mode>${up ? "アカウントを持っている → ログイン" : "はじめての人 → アカウントを作る"}</button>${up ? "" : `<button class="l" data-forgot>パスワードを忘れた</button>`}</div>

    if (t.matches("[data-sync]")) { setStatus("sync"); try { await flush(); await pull(); } catch (er) { setStatus("err"); } return; }
    if (t.matches("[data-out]")) { try { await sb.auth.signOut({ scope: "local" }); } catch (er) {} Q.set([]); closeUI(); return; }

.empty-slot{position:absolute;left:50%;top:20px;width:var(--cw);aspect-ratio:63/88;transform:translateX(-50%);border:2px dashed #C7D0DC;border-radius:14px;display:grid;place-items:center;text-align:center;padding:18px;color:var(--muted);font-size:14px;box-sizing:border-box}
.skel{position:absolute;left:50%;top:20px;width:var(--cw);aspect-ratio:63/88;transform:translateX(-50%);border-radius:12px;background:linear-gradient(110deg,#E3E8F0 30%,#F6F8FB 50%,#E3E8F0 70%);background-size:300% 100%;animation:sk 1.4s linear infinite}
@keyframes sk{to{background-position:-300% 0}}
.cap{display:grid;grid-template-columns:40px 1fr 40px;align-items:center;gap:10px;padding:2px 16px 0;max-width:560px;margin:0 auto}
.cap-mid{text-align:center;min-width:0}
.cap-t{font-weight:900;font-size:16px;line-height:1.35;height:2.7em;display:flex;flex-direction:column;justify-content:center;align-items:stretch;text-align:center;letter-spacing:.02em;word-break:keep-all;overflow-wrap:anywhere;line-break:strict}
.cap-t>span,.gi-t>span,.ev-t{text-wrap:balance;text-align:inherit;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cap-m{font-size:12px;line-height:18px;height:18px;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cap-i{font:600 11px var(--f-num);letter-spacing:.18em;color:var(--faint);margin-top:4px}
.cap-btns{display:flex;justify-content:center;gap:10px;padding:12px 16px 0}

.np{display:flex;align-items:center;gap:12px;margin:18px 16px 0;padding:12px;text-align:left;width:calc(100% - 32px);box-sizing:border-box}
.np-date{flex:none;width:54px;height:58px;border-radius:14px;background:var(--navy);color:#fff;display:grid;place-items:center;align-content:center;line-height:1.1;gap:2px}
.np-date b{font:700 18px/1 var(--f-num)}
.np-date small{font-size:10.5px;opacity:.8}
.np-txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.np-lbl{font-size:11px;font-weight:700;color:var(--cyan);letter-spacing:.08em}
.np-t{font-weight:700;font-size:14.5px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.np-w{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:8px}
.np-in{flex:none;font:700 12px var(--f-num);color:var(--navy);background:var(--panel-2);border-radius:99px;padding:6px 10px}
.hs{display:flex;gap:12px;overflow-x:auto;scrollbar-width:none;padding:2px 16px 8px;scroll-snap-type:x proximity}
.hs::-webkit-scrollbar{display:none}
.tile{flex:none;width:112px;text-align:left;scroll-snap-align:start;display:flex;flex-direction:column;gap:6px}
.tile .th{width:100%;aspect-ratio:63/88;border-radius:7px;overflow:hidden;background:linear-gradient(135deg,#EEF1F6,#C6CCD6);box-shadow:0 4px 12px rgba(20,32,60,.16)}
.th img{display:block;width:100%;height:100%;opacity:0;transition:opacity .3s}
.th img.in{opacity:1}
.tile .tt{font-size:12px;font-weight:700;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* avatars */
.av{width:24px;height:24px;border-radius:50%;display:inline-grid;place-items:center;font-size:11px;font-weight:900;color:#fff;box-shadow:0 0 0 2px #fff;flex:none}
.avs{display:inline-flex;padding-left:6px}
.avs .av{margin-left:-6px}
.av.lg{width:44px;height:44px;font-size:18px}
.av.xl{width:64px;height:64px;font-size:26px}

/* dex */
.pad{padding:0 16px}
.search{position:relative;margin:12px 16px 0}
.search input{width:100%;box-sizing:border-box;height:46px;border-radius:14px;border:0;background:var(--panel);box-shadow:var(--sh-1);padding:0 42px;font-size:16px;outline:none}
.search input:focus-visible{box-shadow:0 0 0 2.5px var(--cyan)}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--faint);width:18px;height:18px}
.search .clr{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:34px;height:34px;border-radius:50%;color:var(--muted);font-size:18px}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:12px 16px 4px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:34px;padding:0 13px;border-radius:99px;background:var(--panel);box-shadow:var(--sh-1);font-size:12.5px;font-weight:700;color:var(--muted);white-space:nowrap;display:inline-flex;align-items:center;gap:5px;transition:transform .12s}
.chip .num{font-size:11px;opacity:.75}
.chip[aria-pressed="true"]{background:var(--navy);color:#fff}
.chip svg{width:15px;height:15px}
.bar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:10px 16px 0;font-size:12px;color:var(--muted)}
.bar select{height:34px;border-radius:10px;border:0;background:var(--panel);box-shadow:var(--sh-1);padding:0 10px;font-size:13px;font-weight:700}
.sample-bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin:12px 16px 0;padding:10px 12px;border-radius:14px;background:rgba(255,255,255,.55);box-shadow:inset 0 0 0 1.5px #D3DAE5;font-size:12.5px;color:var(--muted)}
.sample-bar p{margin:0;flex:1 1 220px}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px 12px;padding:16px 16px 4px}
@media (min-width:640px){.grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:26px 18px}}
.gi{display:flex;flex-direction:column;gap:7px;text-align:center;min-width:0}
.gi .th{border-radius:6px;box-shadow:0 6px 14px rgba(20,32,60,.18);position:relative;aspect-ratio:63/88;overflow:hidden;background:linear-gradient(135deg,#EEF1F6,#C6CCD6);transition:transform .2s}
.gi:active .th{transform:scale(.96)}
.gi-t{font-size:12px;font-weight:700;line-height:1.35;height:2.7em;width:100%;display:flex;flex-direction:column;justify-content:center;align-items:stretch;text-align:center;word-break:keep-all;overflow-wrap:anywhere;line-break:strict}
.gi-o{display:block;width:100%;font-size:11px;line-height:16px;height:16px;color:var(--muted);margin-top:-4px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:36px 16px;font-size:14px}

/* feature */
.seg{display:flex;padding:4px;border-radius:14px;background:#DAE1EB;gap:4px;margin:12px 16px 0}
.seg button{flex:1;height:38px;border-radius:10px;font-size:13.5px;font-weight:700;color:var(--muted);transition:background .15s,color .15s}
.seg button[aria-pressed="true"]{background:var(--panel);color:var(--ink);box-shadow:0 1px 3px rgba(30,42,70,.15)}
.tabs{display:flex;gap:20px;border-bottom:1.5px solid var(--line);margin:8px 16px 0}
.tabs button{position:relative;padding:11px 0 10px;font-weight:700;font-size:14px;color:var(--faint);white-space:nowrap}
.tabs button b{font:600 12px var(--f-num);margin-left:5px}
.tabs button[aria-pressed="true"]{color:var(--ink)}
.tabs button[aria-pressed="true"]::after{content:"";position:absolute;left:0;right:0;bottom:-1.5px;height:3px;border-radius:3px;background:var(--rainbow)}
.ev-list{display:grid;gap:10px;padding:12px 16px 0}
@media (min-width:760px){.ev-list{grid-template-columns:1fr 1fr}}
.ev{display:flex;align-items:stretch;background:var(--panel);border-radius:16px;box-shadow:var(--sh-1);min-width:0}
.ev-main{flex:1;display:flex;gap:12px;padding:10px 0 10px 10px;text-align:left;min-width:0}
.ev-main .th{flex:none;width:60px;border-radius:5px;overflow:hidden;background:linear-gradient(135deg,#EEF1F6,#C6CCD6);box-shadow:0 3px 8px rgba(20,32,60,.18);aspect-ratio:63/88;align-self:flex-start}
.ev-txt{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1}
.ev-t{font-weight:700;font-size:14px;line-height:1.4;word-break:keep-all;overflow-wrap:anywhere;line-break:strict}
.ev-m{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev-p{font:600 12px var(--f-num);color:var(--ink);letter-spacing:.01em}
.bds{display:flex;flex-wrap:wrap;gap:5px;margin-top:3px}
.bd{font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:6px;background:var(--panel-2);color:var(--muted);white-space:nowrap}
.bd.soon{background:#FFF0DE;color:var(--warn)}
.bd.done{background:#E1F5EA;color:var(--ok)}
.bd.plan{background:#E0F3FB;color:#0A7AA3}
.bd.loc{background:#ECEEFF;color:#4652C4}
.fav{flex:none;width:48px;display:grid;place-items:center;color:#C1C8D4;border-radius:0 16px 16px 0}
.fav svg{width:23px;height:23px;transition:transform .2s}
.fav[aria-pressed="true"]{color:var(--pink)}
.fav[aria-pressed="true"] svg{fill:currentColor;transform:scale(1.08)}
.more-btn{display:flex;justify-content:center;padding:16px}

/* calendar */
.cal{margin:14px 16px 0;padding:12px 10px 10px}
.cal-h{display:flex;align-items:center;justify-content:space-between;padding:0 2px 10px}
.cal-h b{font:700 19px/1 var(--f-num);letter-spacing:.02em}
.cal-h b small{font:700 12px var(--f-body);color:var(--muted);margin-left:6px}
.cal-wd{display:grid;grid-template-columns:repeat(7,1fr);font-size:11px;font-weight:700;color:var(--faint);text-align:center;padding-bottom:6px}
.cal-wd span:first-child{color:#DC5068}
.cal-wd span:last-child{color:#3B7FD4}
.cal-g{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px}
.day{position:relative;min-height:68px;border-radius:10px;background:var(--panel-2);padding:3px;text-align:left;display:flex;flex-direction:column;overflow:hidden}
.day.out{opacity:.38}
.day .dn{font:600 11.5px/1 var(--f-num);color:var(--muted);padding:3px 3px 0;align-self:flex-start;border-radius:99px}
.day.sun .dn{color:#DC5068}
.day.sat .dn{color:#3B7FD4}
.day.today .dn{background:var(--navy);color:#fff;padding:3px 5px}
.stamps{position:relative;flex:1;min-height:46px}
.stamp{position:absolute;left:50%;top:50%;width:29px;aspect-ratio:63/88;margin:-20px 0 0 -14.5px;border-radius:3px;background:#fff;padding:1.5px;box-sizing:border-box;box-shadow:0 2px 5px rgba(20,32,60,.25);transform:translate(var(--x,0px),0) rotate(var(--r,-6deg))}
.stamp img{display:block;width:100%;height:100%;border-radius:2px;opacity:0}
.stamp img.in{opacity:1}
.stamp.plan{background:rgba(255,255,255,.6);box-shadow:none;outline:1.5px dashed var(--cyan);outline-offset:0}
.stamp.plan img.in{opacity:.55}
.day .more{position:absolute;right:2px;bottom:2px;font:700 9.5px/1 var(--f-num);background:var(--navy);color:#fff;border-radius:6px;padding:2px 4px}
@media (min-width:640px){.day{min-height:92px}.stamp{width:40px;margin:-28px 0 0 -20px}}
.legend{display:flex;gap:14px;justify-content:flex-end;font-size:11px;color:var(--muted);padding:8px 4px 0}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:10px;height:13px;border-radius:2px;background:linear-gradient(135deg,#FF8FA8,#6FB9FF);box-shadow:0 1px 2px rgba(0,0,0,.2)}
.legend i.p{background:transparent;outline:1.5px dashed var(--cyan)}
.pl-list{display:grid;gap:10px;padding:0 16px}
.pl{display:flex;align-items:center;gap:12px;padding:10px 12px 10px 10px;text-align:left;width:100%;box-sizing:border-box}
.pl-date{flex:none;width:52px;height:56px;border-radius:13px;background:var(--navy);color:#fff;display:grid;place-items:center;align-content:center;line-height:1.1;gap:2px}
.pl-date.past{background:#AAB3C3}
.pl-date b{font:700 17px/1 var(--f-num)}
.pl-date small{font-size:10.5px;opacity:.85}
.pl-txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.pl-t{font-weight:700;font-size:14px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pl-m{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:8px;flex-wrap:wrap}

/* friends */
.fr-add{margin:14px 16px 0;padding:14px;display:grid;gap:10px}
.fr-add .row{display:flex;gap:8px}
.fr-add input{flex:1;min-width:0;height:44px;border:0;border-radius:12px;background:var(--panel-2);padding:0 12px;font-size:16px}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.sw{width:30px;height:30px;border-radius:50%;box-shadow:inset 0 0 0 3px rgba(255,255,255,.65)}
.sw[aria-pressed="true"]{box-shadow:0 0 0 2.5px #fff,0 0 0 4.5px var(--navy)}
.fr-list{display:grid;gap:10px;padding:14px 16px 0}
.fr{display:flex;align-items:center;gap:12px;padding:12px;text-align:left;width:100%;box-sizing:border-box}
.fr-txt{flex:1;min-width:0}
.fr-n{font-weight:900;font-size:15.5px}
.fr-s{font-size:12px;color:var(--muted)}

/* sheet */
.sheet-wrap{position:fixed;inset:0;z-index:90}
.scrim{position:absolute;inset:0;background:rgba(18,26,44,.45);animation:fade .2s}
@keyframes fade{from{opacity:0}}
.sheet{position:absolute;left:0;right:0;bottom:0;max-width:640px;margin:0 auto;max-height:88vh;max-height:88dvh;background:var(--bg);border-radius:24px 24px 0 0;box-shadow:0 -10px 40px rgba(18,26,44,.25);display:flex;flex-direction:column;animation:up .3s cubic-bezier(.2,.8,.2,1)}
.sheet.tall{height:94vh;height:94dvh;max-height:none}
@keyframes up{from{transform:translateY(100%)}}
.grab{flex:none;width:40px;height:5px;border-radius:3px;background:#C3CBD7;margin:9px auto 2px}
.sh-h{flex:none;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 16px 10px}
.sh-h h3{margin:0;font:900 17px/1.35 var(--f-body);letter-spacing:.03em;min-width:0}
.sh-b{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:0 16px calc(24px + env(safe-area-inset-bottom,0px))}
.ev-hero{display:flex;gap:14px;align-items:flex-start;margin-bottom:14px}
.ev-hero .th{flex:none;width:118px;border-radius:8px;box-shadow:0 8px 20px rgba(20,32,60,.22);aspect-ratio:63/88;overflow:hidden;background:linear-gradient(135deg,#EEF1F6,#C6CCD6)}
.dl{display:grid;gap:8px;margin:0;font-size:13.5px}
.dl div{display:grid;grid-template-columns:44px 1fr;gap:8px}
.dl dt{font-size:11.5px;font-weight:700;color:var(--muted);padding-top:1px}
.dl dd{margin:0;font-weight:700;word-break:break-word}
.locs{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 14px}
.locs span{font-size:12px;font-weight:700;padding:4px 9px;border-radius:99px;background:var(--panel);box-shadow:var(--sh-1)}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:6px 0 12px}
.acts .btn{min-height:48px}
.acts .full{grid-column:1/-1}
.sheet-list{display:grid;gap:10px}

/* forms */
.fld{display:grid;gap:6px;margin-bottom:14px}
.fld>label,.lbl{font-size:12px;font-weight:700;color:var(--muted);display:flex;align-items:center;gap:6px}
.fld input,.fld select,.fld textarea{width:100%;box-sizing:border-box;border:0;background:var(--panel);box-shadow:var(--sh-1);border-radius:12px;padding:11px 12px;font-size:16px;min-height:46px;outline:none}
.fld input:focus-visible,.fld select:focus-visible,.fld textarea:focus-visible{box-shadow:0 0 0 2.5px var(--cyan)}
.fld textarea{resize:vertical;min-height:92px;line-height:1.6}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.req{color:var(--ng)}
.cnt{margin-left:auto;font:600 11px var(--f-num)}
.unsure-tag{display:none;font-size:10px;padding:2px 6px;border-radius:6px;background:#FFE7A8;color:#6B4E00}
.fld.unsure .unsure-tag{display:inline-block}
.fld.filled input,.fld.filled textarea,.fld.filled select{animation:fill 1.2s ease}
@keyframes fill{0%{box-shadow:0 0 0 3px var(--gold)}100%{box-shadow:var(--sh-1)}}
.box{background:var(--panel);border-radius:18px;box-shadow:var(--sh-1);padding:14px;margin-bottom:16px}
.box h4{margin:0 0 4px;font-size:14px;display:flex;align-items:center;gap:8px}
.box .fld input,.box .fld select,.box .fld textarea{background:var(--panel-2);box-shadow:none}
.ai{font:700 10px/1 var(--f-num);letter-spacing:.12em;padding:4px 6px;border-radius:6px;background:var(--rainbow);color:#fff;text-shadow:0 1px 1px rgba(0,0,0,.25)}
.f-top{display:grid;grid-template-columns:128px 1fr;gap:16px;align-items:start;margin-bottom:16px}
.f-prev .th{border-radius:8px;box-shadow:0 8px 20px rgba(20,32,60,.22);aspect-ratio:63/88;overflow:hidden;background:linear-gradient(135deg,#EEF1F6,#C6CCD6)}
.f-prev .hint{font-size:11px;color:var(--muted);text-align:center;margin-top:6px}
.f-side{display:grid;gap:10px;align-content:start}
.upl{position:relative;display:inline-flex}
.upl input{position:absolute;inset:0;opacity:0;cursor:pointer}
.f-note{font-size:12px;color:var(--muted);line-height:1.55;margin:0}
.btnrow{display:flex;flex-wrap:wrap;gap:8px}
.ai-row{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.ai-status{font-size:12.5px;color:var(--muted);min-height:1.4em}
.segr{display:flex;border-radius:12px;overflow:hidden;background:var(--panel-2)}
.segr label{flex:1;position:relative}
.segr input{position:absolute;opacity:0;inset:0}
.segr span{display:grid;place-items:center;height:42px;font-size:14px;font-weight:700;color:var(--muted)}
.segr input:checked+span{background:var(--navy);color:#fff}
.segr input:focus-visible+span{outline:2px solid var(--cyan);outline-offset:-2px}
.rate{display:flex;gap:2px}
.rate label{position:relative}
.rate input{position:absolute;opacity:0;inset:0}
.rate span{display:grid;place-items:center;width:40px;height:40px;font-size:25px;color:#D5DBE5}
.rate span.on{color:var(--gold)}
.rate input:focus-visible+span{outline:2px solid var(--cyan);border-radius:8px}
.drow{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.drow input{flex:1;min-width:0}
.drow .dlab{flex:none;font:600 11px var(--f-num);color:var(--faint);width:36px;text-align:right}
.fchips{display:flex;flex-wrap:wrap;gap:8px}
.fchip{height:38px;padding:0 12px 0 6px;border-radius:99px;background:var(--panel-2);display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:700;color:var(--muted)}
.box .fchip{background:var(--panel-2)}
.fchip[aria-pressed="true"]{background:var(--navy);color:#fff}
.fchip.add{padding:0 12px;color:var(--cyan)}
.newf{display:flex;gap:8px;margin-top:10px}
.newf input{flex:1;min-width:0;height:40px;border:0;border-radius:10px;background:var(--panel-2);padding:0 10px;font-size:16px}
.sugg{display:grid;gap:6px;margin-top:6px}
.sugg button{display:flex;gap:10px;align-items:center;text-align:left;padding:8px 10px;border-radius:12px;background:var(--panel);box-shadow:var(--sh-1)}
.sugg .th{width:30px;flex:none;border-radius:3px;overflow:hidden;aspect-ratio:63/88;background:#DDE3EC}
.sugg b{font-size:13px;display:block;line-height:1.35}
.sugg small{font-size:11px;color:var(--muted)}
.linked{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:12px;background:#E0F3FB;color:#0A6A8F;font-size:12.5px;font-weight:700;margin-top:8px}
.linked span{flex:1;min-width:0}
.confirm{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:13px}
.f-actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:8px 0 12px}
.f-actions .btn.primary{flex:1 1 180px;min-height:50px}

/* card back (DOM) */
.tc.big{position:relative;width:100%;aspect-ratio:63/88;container-type:inline-size;transform-style:preserve-3d;transform:rotateX(var(--rx,0deg)) rotateY(calc(var(--ry,0deg) + var(--flip,0deg)));transition:transform .6s cubic-bezier(.2,.75,.2,1)}
.tc.big.flipped{--flip:180deg}
.tc.big.tilting{transition:transform .08s linear}
.tc.big .front{box-shadow:0 18px 44px rgba(20,32,60,.3)}
.tc.big .back{box-shadow:0 18px 44px rgba(20,32,60,.3)}
.bk-outer{position:absolute;inset:0;padding:3.3cqw;background:linear-gradient(160deg,var(--a),var(--b))}

  ["f_title", "f_org", "f_series", "f_start", "f_end", "f_venue", "f_type", "f_price", "f_summary", "f_link", "f_url"].forEach(id => F_(id).addEventListener("input", () => { touched.add(id); F_(id).closest(".fld")?.classList.remove("unsure"); refresh(); }));
  F_("f_dates").addEventListener("dateschange", refresh);

  F_("f_img").addEventListener("change", e => { const f = e.target.files && e.target.files[0]; if (!f) return; if (pickedUrl) URL.revokeObjectURL(pickedUrl); pickedFile = f; pickedUrl = URL.createObjectURL(f); removeImg = false; refresh(); });
  F_("imgClear").onclick = () => { if (pickedUrl) URL.revokeObjectURL(pickedUrl); pickedFile = null; pickedUrl = ""; F_("f_img").value = ""; removeImg = true; refresh(); };
  // AI
  let aiCtl = null;
  F_("aiBtn").onclick = async () => {
    if (!sampleFn) return;
    const title = F_("f_title").value.trim(), paste = F_("f_paste").value.trim().slice(0, 12000);
    if (!title && !paste && !pickedFile) { F_("f_title").focus(); F_("aiStatus").textContent = "イベント名か説明文を入れてください"; return; }
    const useImg = !!(pickedFile && imgOK), ev = init.eventId && EVMAP.get(init.eventId);
    const prompt = `あなたは謎解き・脱出ゲームのイベント情報を整理するアシスタントです。以下の材料から、コレクション用カードのデータを作ってください。

ルール:
- 材料（掲載情報・貼り付けテキスト${useImg ? "・添付画像" : ""}）に書かれている事実を最優先する。
- 材料にない項目は、あなたの知識で確実に分かる場合だけ埋める。推測になる項目は空文字 "" にして、項目名を unsure に入れる。日付や主催を作り話で埋めない。

- type は次のどれか: ${TYPES.join(" / ")}
- organizer は企画・制作した会社名だけ（例: SCRAP、街ハック）。ヰ空間のようなレーベル・シリーズ名は series に入れる。
- summary は日本語 70〜110 字のストーリー紹介。公式の導入（あらすじ）をもとに、ワクワクする書き出しで。結末・答え・仕掛けのネタバレは書かない。
- link は、複数のキットや編を合わせると一つの物語につながる・最終章がある、などの仕組みがあれば 60 字以内で。なければ ""。
- url は材料に書かれている場合だけ入れる。

JSON だけを返す:
{"title":"","organizer":"","series":"","start":"","end":"","venue":"","type":"","price":"","summary":"","link":"","url":"","unsure":[]}

イベント名: ${title || "（未入力）"}
${ev ? `掲載情報: 企画=${ev.o} / 期間=${ev.s || "不明"}〜${ev.e || "未定"} / エリア=${ev.a} / 形式=${ev.k}\n` : ""}${useImg ? "添付画像: カードの表面画像または告知画像。読める文字があれば材料に使う。\n" : ""}貼り付けテキスト:
${paste || "（なし）"}`;
    aiCtl = new AbortController();
    F_("aiBtn").disabled = true; F_("aiStop").hidden = false; F_("aiStatus").textContent = "考え中…";
    try {
      const opts = { signal: aiCtl.signal, cache: false, onText: () => { F_("aiStatus").textContent = "書いています…"; } };
      if (useImg) opts.images = [pickedFile];
      const r = await sampleFn.json(prompt, opts);
      if (!r || typeof r !== "object") throw { code: "invalid_json" };
      const map = { title: "f_title", organizer: "f_org", series: "f_series", link: "f_link", start: "f_start", end: "f_end", venue: "f_venue", type: "f_type", price: "f_price", summary: "f_summary", url: "f_url" };
      let n = 0;
      for (const [k, id] of Object.entries(map)) {
        let v = typeof r[k] === "string" ? r[k].trim() : ""; if (!v) continue;
        if ((k === "start" || k === "end") && !isDate(v)) continue;
        if (k === "type" && !TYPES.includes(v)) v = "その他";
        if (k === "url" && !/^https?:\/\//.test(v)) continue;
        if (touched.has(id) && F_(id).value.trim()) continue;
        F_(id).value = v.slice(0, id === "f_summary" ? 160 : id === "f_link" ? 90 : 80);
        const fld = F_(id).closest(".fld"); fld.classList.remove("filled"); void fld.offsetWidth; fld.classList.add("filled"); n++;
      }
      const uns = Array.isArray(r.unsure) ? r.unsure : [];
      uns.forEach(k => { const id = map[k]; if (id && !touched.has(id)) F_(id).closest(".fld")?.classList.add("unsure"); });
      F_("aiStatus").textContent = n ? `${n}項目を入力しました${uns.length ? "。「要確認」の項目は公式ページで確かめてください" : ""}` : "新しく埋められる項目はありませんでした";
      refresh();
    } catch (err) {
      const code = err && err.code;
      if (code === "cancelled") F_("aiStatus").textContent = "止めました";
      else if (["not_granted", "sampling_disabled", "not_declared", "capability_disabled", "capability_removed"].includes(code)) { F_("aiStatus").textContent = "この表示ではAI入力を使えません"; F_("aiBtn").hidden = true; }
      else if (code === "rate_limited") F_("aiStatus").textContent = "混み合っています。少し時間をおいてもう一度押してください";
      else if (code === "images_unavailable" || code === "image_rejected") { imgOK = false; F_("aiStatus").textContent = "画像は読み取れませんでした。テキストだけでもう一度試せます"; }
      else if (code === "invalid_json") F_("aiStatus").textContent = "うまく読み取れませんでした。もう一度押してください";
      else if (code === "session_expired") F_("aiStatus").textContent = "ログインし直してからもう一度試してください";
      else F_("aiStatus").textContent = "入力できませんでした。もう一度押してください";
    } finally { F_("aiBtn").disabled = false; F_("aiStop").hidden = true; aiCtl = null; }
  };
  F_("aiStop").onclick = () => aiCtl && aiCtl.abort();
  // save
  F_("cardForm").addEventListener("submit", async e => {
    e.preventDefault();
    const c = current();
    if (!c.title) { F_("f_title").focus(); toast("イベント名を入れてください"); return; }
    if (!c.dates.length) { toast("解いた日を入れてください"); return; }
    if (c.url && !/^https?:\/\//i.test(c.url)) c.url = "https://" + c.url;
    const btn = F_("saveBtn"); btn.disabled = true; btn.textContent = "保存中…";
    const oldFront = base.front || "";
    try {
      if (pickedFile) {
        if (!assets) throw { code: "no_assets" };
        const up = await assets.upload(await shrink(pickedFile)); c.front = up.id;
      }
      const data = { ...c }; delete data._img;
      data.updatedAt = new Date().toISOString(); data.createdAt = base.createdAt || data.updatedAt;
      if (base.sample) data.sample = true;
      if (base.ord != null) data.ord = base.ord;
      const id = editing ? base.id : newId("cards");
      await put("cards", id, data);
      if (oldFront && oldFront !== data.front && assets) assets.delete(oldFront).catch(() => {});
      if (src.planId) await del("plans", src.planId).catch(() => {});
      toast(editing ? "変更を保存しました" : "トレカを棚に追加しました");
      pendingCenter = id; closeSheet(); shelfSig = ""; setTab("shelf");
    } catch (err) {
      const code = err && err.code;
      toast(code === "too_large" ? "画像が大きすぎます。20MB以下の画像を選んでください" : code === "unsupported_type" ? "この形式の画像は使えません。JPEG・PNG・WebPを選んでください" : code === "quota_or_state" ? "画像の保存容量がいっぱいです" : code === "no_assets" ? "この表示では画像を登録できません。画像を外すと保存できます" : code === "quota_exceeded" ? "カードの保存上限に達しました" : "保存できませんでした。編集できる権限があるか確認してください");
      btn.disabled = false; btn.textContent = editing ? "変更を保存" : "カードを棚に追加";
    }
  });
  if (editing) F_("delWrap").addEventListener("click", async e => {
    const w = F_("delWrap");
    if (e.target.closest("#delBtn")) { w.innerHTML = `<span class="confirm">このカードを削除しますか？ <button class="btn sm danger" type="button" id="dYes">削除</button><button class="btn sm ghost" type="button" id="dNo">やめる</button></span>`; return; }
    if (e.target.closest("#dNo")) { w.innerHTML = `<button class="btn ghost danger" type="button" id="delBtn">削除</button>`; return; }
    if (e.target.closest("#dYes")) { try { await del("cards", base.id); if (base.front && assets) assets.delete(base.front).catch(() => {}); toast("カードを削除しました"); closeSheet(); } catch (err) { saveErr(err); } }
  });
}
async function shrink(file) {
  try {
    const bmp = await createImageBitmap(file, { imageOrientation: "from-image" });
    const sc = Math.min(1, 1600 / Math.max(bmp.width, bmp.height));
    if (sc === 1 && file.size < 3e6 && /jpeg|png|webp/.test(file.type)) return file;
    const cv = document.createElement("canvas"); cv.width = Math.round(bmp.width * sc); cv.height = Math.round(bmp.height * sc);
    cv.getContext("2d").drawImage(bmp, 0, 0, cv.width, cv.height);
    return (await toBlob(cv, "image/jpeg", .9)) || file;
  } catch (e) { return file; }
}

async function boot() {
  const has = window.claude && typeof window.claude.use === "function";

  db = d; assets = a; sampleFn = s; downloads = dl;
  if (sampleFn && typeof sampleFn.limits === "function") sampleFn.limits().then(l => { imgOK = !!(l && l.images); }).catch(() => {});

  }
  sizeStage(); render();
}

}
